<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Retro Pop logotyp</title>
<desc>En tjock retro-TV med texten RETRO POP på skärmen</desc>

<rect width="512" height="512" fill="#F4E9D8"/>

<!-- Antenn -->
<line x1="200" y1="140" x2="160" y2="60" stroke="#3B3B3B" stroke-width="8" stroke-linecap="round"/>
<line x1="312" y1="140" x2="352" y2="60" stroke="#3B3B3B" stroke-width="8" stroke-linecap="round"/>
<circle cx="160" cy="60" r="9" fill="#E8622C"/>
<circle cx="352" cy="60" r="9" fill="#E8622C"/>

<!-- Fötter -->
<rect x="150" y="410" width="26" height="30" rx="6" fill="#3B3B3B"/>
<rect x="336" y="410" width="26" height="30" rx="6" fill="#3B3B3B"/>

<!-- TV-kropp -->
<rect x="86" y="130" width="340" height="290" rx="46" fill="#E8622C" stroke="#3B3B3B" stroke-width="8"/>

<!-- Skärmpanel -->
<rect x="112" y="160" width="230" height="200" rx="26" fill="#2E4A45" stroke="#3B3B3B" stroke-width="8"/>
<rect x="132" y="180" width="190" height="160" rx="16" fill="#F4E9D8"/>

<!-- Text på skärmen -->
<text x="227" y="253" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#E8622C">RETRO</text>
<text x="227" y="303" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#2E4A45">POP</text>

<!-- Reglage -->
<circle cx="378" cy="210" r="20" fill="#F4C542" stroke="#3B3B3B" stroke-width="6"/>
<line x1="378" y1="210" x2="378" y2="196" stroke="#3B3B3B" stroke-width="4" stroke-linecap="round"/>
<circle cx="378" cy="270" r="20" fill="#F4C542" stroke="#3B3B3B" stroke-width="6"/>
<line x1="378" y1="270" x2="390" y2="260" stroke="#3B3B3B" stroke-width="4" stroke-linecap="round"/>

<rect x="358" y="310" width="40" height="10" rx="5" fill="#2E4A45"/>
<rect x="358" y="326" width="40" height="10" rx="5" fill="#2E4A45"/>

</svg>
